<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slinger Trading Journal</title><style>body{margin:0;background:#07111f;color:#fff;font-family:Arial}main{max-width:900px;margin:auto;padding:16px}h1{color:#f5b942}.card{background:#101d2e;border-radius:12px;padding:15px;margin:12px 0}input,select,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:5px 0;border-radius:8px}input,select,textarea{background:#091522;color:#fff;border:1px solid #34465d}button{background:#f5b942;color:#111;border:0;font-weight:bold}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{flex:1;min-width:120px}.profit{color:#42d392}.loss{color:#ff6b6b}canvas{width:100%;background:#091522}</style></head><body><main><h1>Slinger Trading Journal</h1><div class="stats"><div class="card stat">Total PNL<br><b id="total">R0.00</b></div><div class="card stat">Trades<br><b id="trades">0</b></div><div class="card stat">Win Rate<br><b id="win">0%</b></div></div><div class="card"><h2>Progress</h2><canvas id="chart" width="800" height="220"></canvas></div><div class="card"><h2>New Entry</h2><label>Time Session</label><select id="session"><option>Asian</option><option>London</option><option>New York</option><option>London–New York Overlap</option></select><label>Instrument</label><select id="instrument"><option>Gold (XAUUSD)</option><option>US30</option><option>NASDAQ</option><option>GBPJPY</option><option>GBPUSD</option></select><label>Number of Trades</label><input id="tr" type="number" value="1"><label>Position Size</label><input id="size"><label>RR</label><input id="rr" placeholder="1:2"><label>PNL Result</label><select id="result"><option>Profit</option><option>Loss</option><option>Break-even</option></select><label>PNL Amount</label><input id="amount" type="number"><label>Risk Adherence</label><select id="risk"><option>Yes</option><option>No</option></select><label>Patient for Setup</label><select id="patient"><option>Yes</option><option>No</option></select><label>Overtrading Flag</label><select id="over"><option>No</option><option>Yes</option></select><label>Greed Flag</label><select id="greed"><option>No</option><option>Yes</option></select><label>Psychology Notes</label><textarea id="notes"></textarea><button onclick="save()">Save Entry</button></div><div class="card"><h2>History</h2><div id="history"></div></div></main><script>let e=JSON.parse(localStorage.journal||'[]'),$=x=>document.getElementById(x);function save(){let p=+$('amount').value||0,r=$('result').value;if(r=='Loss')p=-p;if(r=='Break-even')p=0;e.unshift({i:$('instrument').value,s:$('session').value,t:+$('tr').value,p,rr:$('rr').value,n:$('notes').value,d:new Date().toLocaleString()});localStorage.journal=JSON.stringify(e);$('amount').value='';$('notes').value='';render()}function render(){let sum=e.reduce((a,x)=>a+x.p,0),w=e.filter(x=>x.p>0).length;$('total').textContent=(sum<0?'-':'')+'R'+Math.abs(sum).toFixed(2);$('trades').textContent=e.reduce((a,x)=>a+x.t,0);$('win').textContent=e.length?Math.round(w/e.length*100)+'%':'0%';$('history').innerHTML=e.map((x,j)=>'<p><b>'+x.i+'</b> · '+x.s+' · <span class="'+(x.p<0?'loss':'profit')+'">'+(x.p<0?'-':'+')+'R'+Math.abs(x.p).toFixed(2)+'</span><br>'+x.n+'<br><button onclick="e.splice('+j+',1);localStorage.journal=JSON.stringify(e);render()">Delete</button></p>').join('')||'No entries yet.';let c=$('chart'),q=c.getContext('2d'),v=[0],s=0;e.slice().reverse().forEach(x=>v.push(s+=x.p));let mn=Math.min(...v),mx=Math.max(...v);if(mn==mx){mn--;mx++}q.clearRect(0,0,c.width,c.height);q.strokeStyle='#f5b942';q.lineWidth=3;q.beginPath();v.forEach((x,i)=>{let X=i*c.width/(v.length-1),Y=200-(x-mn)/(mx-mn)*180;i?q.lineTo(X,Y):q.moveTo(X,Y)});q.stroke()}render()</script></body></html>
